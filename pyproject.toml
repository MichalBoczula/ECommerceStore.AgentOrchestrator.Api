[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-store-agent-orchestrator"
version = "0.1.0"
description = "Durable workflow API for the ECommerceStore BA-to-QA process."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116,<1",
    "langgraph==1.2.24",
    "langgraph-checkpoint-mongodb==0.5.1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pymongo>=4.18.2,<5",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_store_agent_orchestrator"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
