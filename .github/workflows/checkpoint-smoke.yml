name: Orchestrator contract and checkpoint smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checkpoint-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.18'
      - run: uv python install 3.14
      - name: Install API dependencies
        run: uv sync --locked
      - name: Check Python style
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
      - name: Verify the local MongoDB service configuration
        run: docker compose config --quiet
      - name: Test API and worker integration
        run: uv run --no-sync pytest
      - name: Validate OpenAPI
        run: uvx --from openapi-spec-validator==0.7.2 openapi-spec-validator docs/openapi/agent-orchestrator.v1.yaml
      - name: Resume a review after the first worker exits
        env:
          AO_MONGODB_URI: mongodb://127.0.0.1:27017
        run: |
          run_id="$(uv run --no-project --python 3.14 python -c 'from uuid import uuid4; print(uuid4())')"
          uv run verification/checkpoint_restart_smoke.py pause "$run_id"
          uv run verification/checkpoint_restart_smoke.py resume "$run_id"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API and worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ecommerce-store-agent-orchestrator-api:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke-test both container entry points
        run: |
          set -euo pipefail
          image=ecommerce-store-agent-orchestrator-api:ci
          api="$(docker run -d --network host \
            -e AO_MONGODB_URI="$TEST_MONGODB_URI" \
            -e AO_AUTH_ISSUER=http://127.0.0.1:18901 \
            -e AO_AUTH_AUDIENCE=ci-orchestrator \
            -e AO_AUTH_JWKS_URL=http://127.0.0.1:18901/jwks \
            "$image")"
          trap 'docker rm -f "$api" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --max-time 4 \
            http://127.0.0.1:8080/openapi.json | jq -e '.paths["/api/v1/runs"].post' >/dev/null
          docker run --rm --network host -e AO_MONGODB_URI="$TEST_MONGODB_URI" \
            "$image" python -m ecommerce_store_agent_orchestrator.worker --once

      - name: Scan the API and worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-agent-orchestrator-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Record the scanned image identity
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-agent-orchestrator-api:ci)"
          test -n "$image_id"
          printf 'SCANNED_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
          printf 'Scanned image ID: %s\n' "$image_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag and publish the scanned API and worker image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          set -euo pipefail
          image="docker.io/${DOCKER_USER}/ecommerce-store-agent-orchestrator-api"
          sha_tag="${image}:${GITHUB_SHA}"
          test "$SCANNED_IMAGE_ID" = "$(docker image inspect --format '{{.Id}}' ecommerce-store-agent-orchestrator-api:ci)"

          docker tag ecommerce-store-agent-orchestrator-api:ci "$sha_tag"
          test "$SCANNED_IMAGE_ID" = "$(docker image inspect --format '{{.Id}}' "$sha_tag")"
          docker push "$sha_tag" | tee "$RUNNER_TEMP/image-push-sha.log"
          sha_digest="$(awk '/digest: sha256:/ { digest=$3 } END { print digest }' "$RUNNER_TEMP/image-push-sha.log")"
          [[ "$sha_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            latest_tag="${image}:latest"
            docker tag ecommerce-store-agent-orchestrator-api:ci "$latest_tag"
            test "$SCANNED_IMAGE_ID" = "$(docker image inspect --format '{{.Id}}' "$latest_tag")"
            docker push "$latest_tag" | tee "$RUNNER_TEMP/image-push-latest.log"
            latest_digest="$(awk '/digest: sha256:/ { digest=$3 } END { print digest }' "$RUNNER_TEMP/image-push-latest.log")"
            test "$sha_digest" = "$latest_digest"
          fi

          mkdir -p artifacts
          jq -n --arg image "${image}@${sha_digest}" --arg commit "$GITHUB_SHA" \
            '{application: "agent_orchestrator_api", imageReference: $image, commitSha: $commit}' > artifacts/image-reference.json
          printf 'Published %s from scanned image %s with digest %s.\n' \
            "$sha_tag" "$SCANNED_IMAGE_ID" "$sha_digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the immutable image reference
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: image-reference
          path: artifacts/image-reference.json
          if-no-files-found: error
