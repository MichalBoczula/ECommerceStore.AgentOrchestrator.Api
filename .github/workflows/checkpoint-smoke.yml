name: Orchestrator contract and checkpoint smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.18'
      - run: uv python install 3.14
      - name: Install API dependencies
        run: uv sync --locked
      - name: Check Python style
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
      - name: Verify the local MongoDB service configuration
        run: docker compose config --quiet
      - name: Test API and worker integration
        run: uv run --no-sync pytest
      - name: Validate OpenAPI
        run: uvx --from openapi-spec-validator==0.7.2 openapi-spec-validator docs/openapi/agent-orchestrator.v1.yaml
      - name: Resume a review after the first worker exits
        env:
          AO_MONGODB_URI: mongodb://127.0.0.1:27017
        run: |
          run_id="$(uv run --no-project --python 3.14 python -c 'from uuid import uuid4; print(uuid4())')"
          uv run verification/checkpoint_restart_smoke.py pause "$run_id"
          uv run verification/checkpoint_restart_smoke.py resume "$run_id"
      - name: Build the API and worker image
        run: docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t ecommerce-store-agent-orchestrator-api:ci .
      - name: Smoke-test both container entry points
        run: |
          set -euo pipefail
          image=ecommerce-store-agent-orchestrator-api:ci
          api="$(docker run -d --network host \
            -e AO_MONGODB_URI="$TEST_MONGODB_URI" \
            -e AO_AUTH_ISSUER=http://127.0.0.1:18901 \
            -e AO_AUTH_AUDIENCE=ci-orchestrator \
            -e AO_AUTH_JWKS_URL=http://127.0.0.1:18901/jwks \
            "$image")"
          trap 'docker rm -f "$api" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --max-time 4 \
            http://127.0.0.1:8080/openapi.json | jq -e '.paths["/api/v1/runs"].post' >/dev/null
          docker run --rm --network host -e AO_MONGODB_URI="$TEST_MONGODB_URI" \
            "$image" python -m ecommerce_store_agent_orchestrator.worker --once
      - name: Publish the verified image to Docker Hub
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKER_USER:?Set the DOCKER_USER repository secret}"
          : "${DOCKER_TOKEN:?Set the DOCKER_TOKEN repository secret}"
          repository="${DOCKER_USER}/ecommerce-store-agent-orchestrator-api"
          image="docker.io/$repository"
          tag="$image:$GITHUB_SHA"
          printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin
          docker tag ecommerce-store-agent-orchestrator-api:ci "$tag"
          docker push "$tag"
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" |
            awk -F@ -v repository="$repository" '$1 == repository || $1 == "docker.io/" repository {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p artifacts
          jq -n --arg application 'agent_orchestrator_api' --arg image "$image@$digest" --arg commit "$GITHUB_SHA" \
            '{application: $application, imageReference: $image, commitSha: $commit}' > artifacts/image-reference.json
      - name: Upload the immutable image reference
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: image-reference
          path: artifacts/image-reference.json
          if-no-files-found: error
